<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <style>
      .card-bg { fill: #ffffff; stroke: #d0d7de; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #1f2328; }
      .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 12px; fill: #656d76; }
      .row-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2328; }
      .row-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 11px; fill: #656d76; }
      .val-text-mcp { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #1a7f37; }
      .val-text-vision { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #bf8700; }
      .val-text-dom { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #cf222e; }
      .track-bg { fill: #f6f8fa; stroke: #eaeef2; }
      .pill-bg { fill: #f6f8fa; stroke: #d0d7de; }
      .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #424a53; }
      .pill-val { font-weight: 700; fill: #1f2328; }

      @media (prefers-color-scheme: dark) {
        .card-bg { fill: #0d1117; stroke: #30363d; }
        .title-text { fill: #e6edf3; }
        .subtitle-text { fill: #8b949e; }
        .row-label { fill: #e6edf3; }
        .row-desc { fill: #8b949e; }
        .val-text-mcp { fill: #3fb950; }
        .val-text-vision { fill: #d29922; }
        .val-text-dom { fill: #f85149; }
        .track-bg { fill: #161b22; stroke: #21262d; }
        .pill-bg { fill: #161b22; stroke: #30363d; }
        .pill-text { fill: #8b949e; }
        .pill-val { fill: #e6edf3; }
      }
    </style>
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2da44e" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
    <linearGradient id="visionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922" />
      <stop offset="100%" stop-color="#e3b341" />
    </linearGradient>
    <linearGradient id="domGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cf222e" />
      <stop offset="100%" stop-color="#f85149" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="878" height="338" rx="12" class="card-bg" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(32, 34)">
    <text x="0" y="0" class="title-text">单次服务排查任务 · 大模型上下文 Token 消耗实测</text>
    <text x="0" y="20" class="subtitle-text">以 Dubbo 生产订单排查为例 · 基于 OpenAI cl100k_base 分词计量（越少越优）</text>
  </g>

  <!-- Row 1: Dubbo-MCP -->
  <g transform="translate(32, 90)">
    <text x="0" y="14" class="row-label">Dubbo-MCP</text>
    <text x="0" y="30" class="row-desc">纯结构化 JSON-RPC · 零网页噪音</text>
    <!-- Bar Track -->
    <rect x="230" y="3" width="460" height="20" rx="4" class="track-bg" />
    <!-- Bar (572 tokens -> ~1.4%, rendered as prominent 12px pill) -->
    <rect x="230" y="3" width="12" height="20" rx="4" fill="url(#mcpGrad)" />
    <!-- Value -->
    <text x="704" y="18" class="val-text-mcp">572 <tspan font-size="11" font-weight="500">(基准 · 1x)</tspan></text>
  </g>

  <!-- Row 2: Vision Browser Agent -->
  <g transform="translate(32, 146)">
    <text x="0" y="14" class="row-label">视觉浏览器 Agent</text>
    <text x="0" y="30" class="row-desc">6 轮 1280×800 截图 · 历史复合累加</text>
    <!-- Bar Track -->
    <rect x="230" y="3" width="460" height="20" rx="4" class="track-bg" />
    <!-- Bar (33465 / 40500 * 460 = 380px) -->
    <rect x="230" y="3" width="380" height="20" rx="4" fill="url(#visionGrad)" />
    <!-- Value -->
    <text x="704" y="18" class="val-text-vision">33,465 <tspan font-size="11" font-weight="500">(58.5×)</tspan></text>
  </g>

  <!-- Row 3: DOM Browser Agent -->
  <g transform="translate(32, 202)">
    <text x="0" y="14" class="row-label">DOM 浏览器 Agent</text>
    <text x="0" y="30" class="row-desc">5 轮 DOM 树循环 · 充斥 HTML/CSS 标签</text>
    <!-- Bar Track -->
    <rect x="230" y="3" width="460" height="20" rx="4" class="track-bg" />
    <!-- Bar (40500 / 40500 * 460 = 460px) -->
    <rect x="230" y="3" width="460" height="20" rx="4" fill="url(#domGrad)" />
    <!-- Value -->
    <text x="704" y="18" class="val-text-dom">40,500 <tspan font-size="11" font-weight="500">(70.8×)</tspan></text>
  </g>

  <!-- Bottom Metric Pills -->
  <g transform="translate(32, 268)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="258" height="42" rx="8" class="pill-bg" />
    <text x="16" y="26" class="pill-text">⚡ 耗时：<tspan class="pill-val">&lt; 1s</tspan> vs ~35s</text>

    <!-- Pill 2 -->
    <rect x="274" y="0" width="268" height="42" rx="8" class="pill-bg" />
    <text x="16" y="26" class="pill-text">💰 单次成本：<tspan class="pill-val">~$0.001</tspan> vs ~$0.12</text>

    <!-- Pill 3 -->
    <rect x="558" y="0" width="258" height="42" rx="8" class="pill-bg" />
    <text x="16" y="26" class="pill-text">🎯 交互轮数：<tspan class="pill-val">1 轮直达</tspan> vs 5~6 轮</text>
  </g>
</svg>
