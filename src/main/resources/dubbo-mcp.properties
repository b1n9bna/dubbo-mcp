# ==============================================================================
# Dubbo-MCP Configuration File (Enterprise Multi-Environment Setup)
# ==============================================================================

# Currently active environment (test / uat / prod)
active.env=test

# ------------------------------------------------------------------------------
# 1. Test Environment (Direct ZooKeeper / Nacos RPC)
# ------------------------------------------------------------------------------
env.test.type=zookeeper
env.test.registry=zookeeper://127.0.0.1:2181
env.test.timeout=5000
env.test.readonly=false

# ------------------------------------------------------------------------------
# 2. UAT / Staging Environment
# ------------------------------------------------------------------------------
env.uat.type=zookeeper
env.uat.registry=zookeeper://10.20.1.15:2181
env.uat.timeout=5000
env.uat.readonly=true

# ------------------------------------------------------------------------------
# 3. Production Environment (Zero-Friction Dubbo-Admin HTTP Bridge)
# ------------------------------------------------------------------------------
env.prod.type=dubbo-admin
env.prod.admin_url=https://dubbo-admin.yourcompany.com
env.prod.admin_cookie=
env.prod.admin_username=
env.prod.admin_password=
env.prod.readonly=true
env.prod.data_masking=true

# ------------------------------------------------------------------------------
# Security & Safety Guards
# ------------------------------------------------------------------------------
# Method name regex for allowed read-only calls when readonly=true
security.readonly.regex=^(get|query|find|select|list|count|check|is|search|fetch|read).*$

# Gemini-Style Local Loopback Auth Port
auth.callback.port=20888
