name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '8', '11', '17', '21' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Run test suite
        run: mvn clean test --no-transfer-progress

  package:
    name: Package Fat-JAR
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Fat-JAR
        run: mvn clean package -DskipTests --no-transfer-progress

      - name: Verify shaded dependency boundaries
        run: python3 scripts/check_runtime_dependencies.py target/dubbo-mcp.jar

      - name: Verify CLI Executable
        run: |
          java -jar target/dubbo-mcp.jar --help

      - name: Verify offline runtime boundaries
        timeout-minutes: 3
        run: |
          python3 scripts/smoke_limits.py target/dubbo-mcp.jar
          python3 scripts/smoke_http_limits.py target/dubbo-mcp.jar
          python3 scripts/smoke_install.py
          python3 scripts/smoke_login.py target/dubbo-mcp.jar

  windows-installer:
    name: Windows installer regression
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify artifact selection and failed validation rollback
        shell: powershell
        run: ./scripts/smoke_install.ps1
